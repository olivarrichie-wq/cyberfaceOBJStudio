
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP"
          test -d CyberfaceOBJStudioAndroid || exit 1

      - name: Build APK
        run: |
          cd CyberfaceOBJStudioAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberfaceOBJStudio-APK
          path: CyberfaceOBJStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
