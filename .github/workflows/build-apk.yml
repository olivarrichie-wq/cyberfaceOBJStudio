
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Walang ZIP file sa repository."
            exit 1
          fi
          unzip "$ZIP"
          cd CyberfaceOBJStudioAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CyberfaceOBJStudio-APK
          path: CyberfaceOBJStudio/app/build/outputs/apk/debug/app-debug.apk
